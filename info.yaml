# Tiny Tapeout project information
project:
  title:        "PESM: Protocol Engine State Machine"
  author:       "grcheulishvili"
  discord:      ""
  description:  "Microcoded, cycle-exact protocol emulator (UART/SPI/I2C/USB-LS/... as firmware) with SPI host port"
  language:     "Verilog"
  clock_hz:     50000000

  # Jane Street protocol-emulator competition allocation
  tiles: "6x4"

  top_module:  "tt_um_protocol_engine"

  source_files:
    - "tt_um_protocol_engine.v"
    - "pesm_core.v"
    - "pesm_host.v"
    - "pesm_fifo.v"
    - "pesm_clkdiv.v"
    - "pesm_sync.v"
    - "pesm_mux4.v"

pinout:
  # Inputs
  ui[0]: "HOST_SCK"
  ui[1]: "HOST_MOSI"
  ui[2]: "HOST_CS_N"
  ui[3]: "MODE (1=BOOT 0=RUN)"
  ui[4]: "TIN0"
  ui[5]: "TIN1"
  ui[6]: "TIN2"
  ui[7]: "TIN3"

  # Outputs
  uo[0]: "HOST_MISO"
  uo[1]: "TOUT0"
  uo[2]: "TOUT1"
  uo[3]: "TOUT2"
  uo[4]: "TOUT3"
  uo[5]: "TOUT4"
  uo[6]: "TOUT5"
  uo[7]: "TOUT6"

  # Bidirectional pins
  uio[0]: "BIO0"
  uio[1]: "BIO1"
  uio[2]: "BIO2"
  uio[3]: "BIO3"
  uio[4]: "BIO4"
  uio[5]: "BIO5"
  uio[6]: "BIO6"
  uio[7]: "BIO7"

# Do not change!
yaml_version: 6
